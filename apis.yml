aid: pintarnya
name: Pintarnya
description: >-
  Pintarnya is an Indonesian technology startup, launched in May 2022, that
  operates an employment and financial-services super-app for the country's
  blue-collar and entry-level workforce (education levels from elementary school
  through bachelor's degree, "SD-S1"). The platform aggregates tens of thousands
  of daily-updated job listings across 300+ Indonesian cities and pairs job
  search with Cari Cuan side-income tasks, Siap Kerja skill-building video
  courses, a CV builder, and an employer/recruiter posting product used by tens
  of thousands of companies. Pintarnya reports more than 10 million registered
  job seekers and is registered with Indonesia's Ministry of Labor (KEMNAKER).
  It is a consumer web and mobile product; no public developer API, OpenAPI
  description, or developer portal is published as of this profile.
